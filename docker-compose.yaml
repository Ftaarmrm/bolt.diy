services:
  app-prod:
    image: bolt-ai:production
    build:
      context: .
      dockerfile: Dockerfile
      target: bolt-ai-production
      args:
        # Only non-sensitive build args (public config)
        VITE_LOG_LEVEL: ${VITE_LOG_LEVEL:-debug}
        DEFAULT_NUM_CTX: ${DEFAULT_NUM_CTX:-8192}
    ports:
      - '5173:5173'
    env_file: 
      - '.env'
      - '.env.local'
    environment:
      - NODE_ENV=production
      - COMPOSE_PROFILES=production
      # Network config
      - PORT=5173
      - HOST=0.0.0.0
      # Deployment domain (optional, for host validation)
      - COOLIFY_FQDN=${COOLIFY_FQDN:-}
      - VITE_PUBLIC_APP_URL=${VITE_PUBLIC_APP_URL:-}
      # Logging
      - VITE_LOG_LEVEL=${VITE_LOG_LEVEL:-debug}
      - DEFAULT_NUM_CTX=${DEFAULT_NUM_CTX:-8192}
      - RUNNING_IN_DOCKER=true
      # ====================================================================
      # SECRET API KEYS (Runtime only - NEVER in build args)
      # ====================================================================
      # These are provided at runtime from docker-compose env or .env files
      # DO NOT pass these as build args (they would appear in build logs)
      # Instead, set them in .env.local or via docker-compose environment override
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPEN_ROUTER_API_KEY=${OPEN_ROUTER_API_KEY:-}
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY:-}
      - HuggingFace_API_KEY=${HuggingFace_API_KEY:-}
      # Local/custom provider URLs
      - OLLAMA_API_BASE_URL=${OLLAMA_API_BASE_URL:-}
      - OPENAI_LIKE_API_KEY=${OPENAI_LIKE_API_KEY:-}
      - OPENAI_LIKE_API_BASE_URL=${OPENAI_LIKE_API_BASE_URL:-}
      - OPENAI_LIKE_API_MODELS=${OPENAI_LIKE_API_MODELS:-}
      - TOGETHER_API_BASE_URL=${TOGETHER_API_BASE_URL:-}
      - LMSTUDIO_API_BASE_URL=${LMSTUDIO_API_BASE_URL:-}
      - AWS_BEDROCK_CONFIG=${AWS_BEDROCK_CONFIG:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5173/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    profiles:
      - production

  app-dev:
    image: bolt-ai:development
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        VITE_LOG_LEVEL: ${VITE_LOG_LEVEL:-debug}
        DEFAULT_NUM_CTX: ${DEFAULT_NUM_CTX:-8192}
    env_file: 
      - '.env'
      - '.env.local'
    environment:
      - NODE_ENV=development
      - VITE_HMR_PROTOCOL=ws
      - VITE_HMR_HOST=localhost
      - VITE_HMR_PORT=5173
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - PORT=5173
      - HOST=0.0.0.0
      # Secret keys for development (from .env.local)
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPEN_ROUTER_API_KEY=${OPEN_ROUTER_API_KEY:-}
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY:-}
      - HuggingFace_API_KEY=${HuggingFace_API_KEY:-}
      - OLLAMA_API_BASE_URL=${OLLAMA_API_BASE_URL:-}
      - OPENAI_LIKE_API_KEY=${OPENAI_LIKE_API_KEY:-}
      - OPENAI_LIKE_API_BASE_URL=${OPENAI_LIKE_API_BASE_URL:-}
      - OPENAI_LIKE_API_MODELS=${OPENAI_LIKE_API_MODELS:-}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
      - TOGETHER_API_BASE_URL=${TOGETHER_API_BASE_URL:-}
      - LMSTUDIO_API_BASE_URL=${LMSTUDIO_API_BASE_URL:-}
      - AWS_BEDROCK_CONFIG=${AWS_BEDROCK_CONFIG:-}
      - VITE_LOG_LEVEL=${VITE_LOG_LEVEL:-debug}
      - DEFAULT_NUM_CTX=${DEFAULT_NUM_CTX:-8192}
      - RUNNING_IN_DOCKER=true
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - type: bind
        source: .
        target: /app
        consistency: cached
      - /app/node_modules
    ports:
      - '5173:5173'
    command: pnpm run dev --host 0.0.0.0
    profiles: ['development', 'default']

  app-prebuild:
    image: ghcr.io/stackblitz-labs/bolt.diy:latest
    ports:
      - '5173:5173'
    environment:
      - NODE_ENV=production
      - COMPOSE_PROFILES=production
      - PORT=5173
      - HOST=0.0.0.0
      - OLLAMA_API_BASE_URL=${OLLAMA_API_BASE_URL:-http://127.0.0.1:11434}
      - DEFAULT_NUM_CTX=${DEFAULT_NUM_CTX:-8192}
      - RUNNING_IN_DOCKER=true
      # Secret keys from .env files
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPEN_ROUTER_API_KEY=${OPEN_ROUTER_API_KEY:-}
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY:-}
      - HuggingFace_API_KEY=${HuggingFace_API_KEY:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    profiles:
      - prebuilt
